[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drt-planning-toolkit"
version = "1.0.0"
description = "Integrated ex-ante DRT simulation and ex-post performance evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3.1", "scipy>=1.13,<2"]

[project.scripts]
drt-toolkit = "drt_toolkit.pipeline:main"

[tool.setuptools]
packages = ["drt_toolkit"]

[tool.setuptools.package-data]
drt_toolkit = ["r/*.R"]
